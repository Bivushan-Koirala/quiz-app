<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUIZ APP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form id="quiz">
      <h1 id="mcq">MCQ QUIZ</h1>

      <h2 id="question"></h2>

      <div>
        <button type="button" class="option" id="Pokhara"></button>
      </div>
      <div>
        <button type="button" class="option" id="Jhapa"></button>
      </div>
      <div>
        <button type="button" class="option" id="Kathmandu"></button>
      </div>
      <div>
        <button type="button" class="option" id="Birgunj"></button>
      </div>

      <div id="buttonContainer">
        <button type="button" id="mySubmit">Submit</button>
        <button type="button" id="next">Next</button>
      </div>
      <p id="myResult"></p>
      <p id="score">Score: 0</p>
    </form>

    <script src="index.js"></script>
  </body>
</html>
